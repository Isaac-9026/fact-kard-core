name: Integración Continua (CI)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: America/Lima

jobs:
  backend-tests:
    name: Backend Tests (Django + PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fact_kard
          POSTGRES_USER: fact_kard_user
          POSTGRES_PASSWORD: secret_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ejecutar Suite de Tests de Django
        working-directory: backend
        env:
          DEBUG: 'True'
          SECRET_KEY: 'ci-secret-key-fact-kard-core-long-enough-for-testing-in-github-actions-2026'
          ALLOWED_HOSTS: 'localhost,127.0.0.1'
          DB_NAME: fact_kard
          DB_USER: fact_kard_user
          DB_PASSWORD: secret_ci_password
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python manage.py test

  frontend-tests-and-build:
    name: Frontend Tests y Build (React + TS + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias limpias
        working-directory: frontend
        run: npm ci

      - name: Ejecutar Tests Unitarios de Frontend
        working-directory: frontend
        run: npm test -- --run

      - name: Compilar Frontend para Producción
        working-directory: frontend
        run: npm run build

