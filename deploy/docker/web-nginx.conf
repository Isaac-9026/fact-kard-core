# Nginx INTERNO de Fact-Kard Core (contenedor web). Detrás del proxy compartido.
# El HTTPS lo pone el proxy; aquí se conserva X-Forwarded-Proto para Django
# (SECURE_PROXY_SSL_HEADER) y se agrega la IP al X-Forwarded-For (Django: NUM_PROXIES=2).

# Si llega directo (prueba local sin proxy) no hay X-Forwarded-Proto: se usa el esquema real.
map $http_x_forwarded_proto $fk_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream fact_kard_api {
    server backend:8001;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Uploads: capturas XML/PDF/imagen de hasta 10 MB (CAPTURA_MAX_BYTES) + margen.
    client_max_body_size 12m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # --- API Django (Gunicorn) ---
    location /api/ {
        proxy_pass http://fact_kard_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fk_proto;
        # Excel del Kardex / Formato 13.1 pueden tardar (Gunicorn timeout = 120 s).
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location = /api/health/ {
        access_log off;
        proxy_pass http://fact_kard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fk_proto;
    }

    # --- Admin de Django (solo si DJANGO_ADMIN_ENABLED=True) ---
    location /admin/ {
        proxy_pass http://fact_kard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fk_proto;
    }

    # --- Logos de empresa (lo único de MEDIA_ROOT que se publica) ---
    # Solo empresas/<id>/logos/<uuid32>.webp (ver empresas.models.ruta_logo_empresa). Cualquier otra
    # ruta bajo /media/ responde 404: nada más de los archivos subidos queda expuesto.
    location ~ "^/media/(empresas/[0-9]+/logos/[0-9a-f]{32}\.webp)$" {
        alias /srv/fact-kard/datos/media/$1;
        default_type image/webp;
        expires 7d;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }
    location /media/ {
        return 404;
    }

    # --- Archivos estáticos de Django (collectstatic) ---
    location /static/ {
        alias /srv/fact-kard/static/;
        expires 30d;
        access_log off;
    }

    # --- Frontend React ---
    root /usr/share/nginx/html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # Rutas del SPA (/dashboard, /kardex, ...) → index.html, que nunca se cachea.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}
