# Stack de PRODUCCIÓN de Fact-Kard Core (Docker Compose).
#
#   cd deploy/docker
#   cp env.produccion.example .env   # completar (nunca a Git)
#   docker network create proxy_net  # una sola vez por servidor (red compartida con el proxy)
#   docker compose build
#   docker compose up -d
#
# Redes:
#   datos     (internal) db + redis + backend + tareas → la base y Redis no salen a Internet
#   app       (bridge)   backend + web                 → la consulta RUC puede salir a Internet
#   proxy_net (externa)  web + proxy compartido        → único camino desde Internet (80/443 del proxy)
# NINGÚN servicio publica puertos aquí (Docker se salta UFW). Para probar en la laptop sin proxy
# se usa compose.local.yaml, que publica solo 127.0.0.1:8083.
#
# Convive en el mismo servidor con FACT-KARD (proyecto "factkard") y el sistema del turno mañana:
# nombre de proyecto, volúmenes, imágenes y alias propios; los límites de memoria suman ~2 GB.
name: factkard-core

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fact_kard_core}
      POSTGRES_USER: ${DB_USER:-fact_kard_core_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en deploy/docker/.env}
      TZ: America/Lima
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [datos]
    shm_size: 256mb
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Solo caché (throttling del login): sin persistencia en disco y con tope de memoria.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [datos]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    image: factkard-core-backend:local
    restart: unless-stopped
    env_file: [.env]
    # Fijos del contenedor (tienen prioridad sobre .env): rutas y servicios internos.
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      CACHE_URL: redis://redis:6379/0
      GUNICORN_BIND: 0.0.0.0:8001
      # Gunicorn solo es alcanzable desde la red interna (el contenedor web).
      GUNICORN_FORWARDED_ALLOW_IPS: "*"
      STATIC_ROOT: /srv/fact-kard/static
      MEDIA_ROOT: /srv/fact-kard/datos/media
      FACT_KARD_BACKUP_DIR: /srv/fact-kard/datos/respaldos
      TZ: America/Lima
    volumes:
      - media:/srv/fact-kard/datos/media
      - static:/srv/fact-kard/static
      # Respaldos en una carpeta del servidor (para copiarlos fuera del VPS).
      - ${FK_DIR_RESPALDOS:-./datos/respaldos}:/srv/fact-kard/datos/respaldos
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [datos, app]
    mem_limit: 1g

  # Tareas automáticas: respaldo completo diario (base + media) con retención.
  # Misma imagen del backend; sin salida a Internet ni puertos.
  tareas:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    image: factkard-core-backend:local
    restart: unless-stopped
    command: ["fk-tareas"]
    env_file: [.env]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      CACHE_URL: redis://redis:6379/0
      STATIC_ROOT: /srv/fact-kard/static
      MEDIA_ROOT: /srv/fact-kard/datos/media
      FACT_KARD_BACKUP_DIR: /srv/fact-kard/datos/respaldos
      FK_RESPALDO_HORA: ${FK_RESPALDO_HORA:-04:00}
      TZ: America/Lima
    volumes:
      - media:/srv/fact-kard/datos/media:ro
      - ${FK_DIR_RESPALDOS:-./datos/respaldos}:/srv/fact-kard/datos/respaldos
    depends_on:
      backend:
        condition: service_healthy
    networks: [datos]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/fk-tareas.vivo"]
      interval: 60s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    image: factkard-core-web:local
    restart: unless-stopped
    volumes:
      - static:/srv/fact-kard/static:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      app: {}
      proxy_net:
        aliases: [factkard-core-web]
    mem_limit: 96m

networks:
  datos:
    internal: true
  app: {}
  proxy_net:
    external: true
    name: proxy_net

volumes:
  pgdata:
  media:
  static:
